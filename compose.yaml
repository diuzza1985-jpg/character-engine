services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - meilisearch
            - mailpit
            - selenium
    scheduler:
        # Riusa la stessa immagine già costruita per laravel.test (nessun secondo build, nessun
        # secondo Dockerfile) ma con un comando diverso al posto di supervisord/artisan-serve:
        # start-container (l'entrypoint dell'immagine Sail) esegue direttamente qualunque comando
        # gli venga passato invece di avviare supervisord, se presente — verificato leggendolo
        # nell'immagine reale prima di aggiungere questo servizio. 'schedule:work' è l'equivalente
        # perpetuo di un vero cron (valuta routes/console.php ogni minuto), necessario perché
        # nessun cron di sistema gira dentro questi container — senza questo servizio,
        # character:plan-daily-post/character:publish-due-posts non sarebbero mai partiti da soli.
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            # A differenza di laravel.test sopra, questo servizio esegue davvero il ramo
            # "gosu $WWWUSER" dell'entrypoint dell'immagine (start-container: solo se gli si
            # passa un comando, come qui) — richiede WWWUSER valorizzato per davvero, non
            # solo ereditato da ${WWWUSER} (che qui non arriva da nessuna parte quando si usa
            # "docker compose" invece del wrapper ./vendor/bin/sail, che di solito lo calcola
            # lui). Hardcoded all'UID reale dell'host (verificato con "id -u"), non un
            # placeholder.
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
        command: php artisan schedule:work
    queue:
        # Stesso pattern del servizio scheduler sopra (stessa immagine sail-8.5/app già costruita,
        # nessun secondo build, WWWUSER hardcoded per lo stesso motivo lì spiegato): bug reale
        # trovato verificando "docker compose ps" in vista del deploy — nessun worker di coda
        # girava da nessuna parte, quindi i $tries/$backoff già scritti su PublishInstagramPostJob
        # (5 tentativi, backoff crescente) non scattavano mai quando il job veniva dispatchato con
        # dispatchSync() invece che su una coda vera (Post#50, 2 settembre 2026: fallito all'unico
        # tentativo per un errore transitorio di Meta, mai ritentato). QUEUE_CONNECTION=database
        # (.env): --tries/--backoff qui sono solo un fallback, il job definisce già i suoi.
        #
        # --timeout=3600 (bug reale corretto il 4 settembre 2026): il default di "queue:work" è 60
        # secondi — questo container ha pcntl, quindi Laravel applica il timeout uccidendo il
        # processo figlio che esegue il job; girando come PID 1 senza init, quel kill si è portato
        # via l'intero container (uscito subito dopo un solo giro di sleep da 60s dentro
        # PublishInstagramPostJob::waitUntilReady(), che può polling fino a 5 minuti per container
        # più i minuti di ogni singola slide di un carousel — ben oltre il default). Verificato nei
        # log del container: RUNNING alle 07:15:03, morto alle 07:16:03, esattamente 60s dopo.
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
        command: php artisan queue:work --tries=5 --backoff=30,60,300,900,3600 --timeout=3600
    ngrok:
        image: 'ngrok/ngrok:latest'
        restart: unless-stopped
        environment:
            NGROK_AUTHTOKEN: '${NGROK_AUTHTOKEN}'
        command:
            - http
            - 'laravel.test:80'
            - '--url=waking-dispense-uniformed.ngrok-free.dev'
        networks:
            - sail
        depends_on:
            - laravel.test
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        image: 'getmeili/meilisearch:latest'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    selenium:
        image: selenium/standalone-chromium
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
